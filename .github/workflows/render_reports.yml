{
  "name": "Render Spotify Reports",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "renderer-test": {
      "name": "WeasyPrint + PyMuPDF 30+20 test",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "steps": [
        {
          "name": "Checkout repository",
          "uses": "actions/checkout@v7"
        },
        {
          "name": "Setup Python 3.13",
          "uses": "actions/setup-python@v7",
          "with": {
            "python-version": "3.13"
          }
        },
        {
          "name": "Install Linux dependencies for WeasyPrint",
          "run": "sudo apt-get update\nsudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libharfbuzz-subset0 libfontconfig1 libffi-dev libjpeg-dev libopenjp2-7-dev shared-mime-info fonts-dejavu"
        },
        {
          "name": "Install Python packages",
          "run": "python -m pip install --upgrade pip\npython -m pip install weasyprint==70.0 pymupdf==1.28.2 pillow"
        },
        {
          "name": "Verify renderer libraries",
          "run": "python -c \"import weasyprint, fitz, PIL; print('WeasyPrint:', weasyprint.__version__); print('PyMuPDF:', fitz.VersionBind); print('Pillow:', PIL.__version__)\""
        },
        {
          "name": "Check renderer files",
          "run": "test -f renderer/renderer_production_poc.py\ntest -f renderer/templates/report_template.html\necho 'Renderer files found.'"
        },
        {
          "name": "Run 30 + 20 test",
          "run": "rm -rf artifacts/report_30_plus_20\npython renderer/renderer_production_poc.py --template renderer/templates/report_template.html --outdir artifacts/report_30_plus_20"
        },
        {
          "name": "Validate 50-row PNG",
          "run": "python -c \"from pathlib import Path; import fitz; from PIL import Image; out=Path('artifacts/report_30_plus_20'); png=out/'report_30_plus_20.png'; pdf=out/'report_30_plus_20.pdf'; csv=out/'history_30_plus_20.csv'; assert png.exists(), 'PNG missing'; assert pdf.exists(), 'PDF missing'; assert csv.exists(), 'CSV missing'; img=Image.open(png); print('PNG:', img.size); assert img.size==(2400,3400), f'Unexpected PNG size: {img.size}'; doc=fitz.open(pdf); print('PDF pages:', len(doc)); assert len(doc)==1, f'Expected 1 PDF page, got {len(doc)}'; doc.close(); lines=csv.read_text(encoding='utf-8').splitlines(); print('CSV lines:', len(lines)); assert len(lines)==51, f'Expected 51 CSV lines including header, got {len(lines)}'; playlist_x=sum('playlist_x' in line for line in lines[1:]); random_rows=sum(',random,' in line for line in lines[1:]); print('Playlist X rows:', playlist_x); print('Random rows:', random_rows); assert playlist_x==30, f'Expected 30 Playlist X rows, got {playlist_x}'; assert random_rows==20, f'Expected 20 random rows, got {random_rows}'; print('VALIDATION OK: 50 rows = 30 Playlist X + 20 random; 1 PDF page; 2400x3400 PNG.')\""
        },
        {
          "name": "Upload test artifacts",
          "uses": "actions/upload-artifact@v7",
          "with": {
            "name": "weasyprint-test-30-plus-20",
            "path": "artifacts/report_30_plus_20",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        }
      ]
    }
  }
}
