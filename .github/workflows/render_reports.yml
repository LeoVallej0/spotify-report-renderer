name: Render Spotify Reports

on:
  workflow_dispatch: {}
  repository_dispatch:
    types:
      - render_scheduled
      - render_manual_test

permissions:
  contents: read

concurrency:
  group: spotify-report-renderer
  cancel-in-progress: false

jobs:
  smoke-test:
    name: Smoke test renderer
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Linux dependencies for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libpangocairo-1.0-0 \
            libcairo2 \
            libffi-dev \
            shared-mime-info

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r renderer/requirements.txt

      - name: Smoke test
        run: python renderer/smoke_test.py

      - name: Show repository dispatch payload
        if: ${{ github.event_name == 'repository_dispatch' }}
        env:
          PAYLOAD_JSON: ${{ toJson(github.event.client_payload) }}
        run: |
          python - <<'PY'
          import os

          payload = os.environ.get('PAYLOAD_JSON', '')

          print(
              'repository_dispatch payload bytes:',
              len(payload.encode('utf-8'))
          )

          print(payload[:4000])
          PY
