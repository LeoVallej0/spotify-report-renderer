name: Render Spotify Reports

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - render_real_test
      - render_scheduled
      - render_manual_test

permissions:
  contents: read

jobs:
  renderer-test:
    name: Chromium X-only dynamic mobile renderer
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: renderer/requirements.txt

      - name: Install Python packages
        run: python -m pip install -r renderer/requirements.txt

      - name: Cache Chromium
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('renderer/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Install Chromium (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      - name: Verify Playwright Chromium
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True,
                  args=['--no-sandbox', '--disable-dev-shm-usage']
              )
              browser.close()
          print('PLAYWRIGHT CHROMIUM OK')
          PY

      - name: Prepare payload
        env:
          PAYLOAD_JSON: ${{ toJson(github.event.client_payload) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            printf '%s' "$PAYLOAD_JSON" > payload.json
          else
            python renderer/create_fixture.py
            mv fixture_payload.json payload.json
          fi

          python -m json.tool payload.json >/dev/null

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('payload.json')
          p = json.loads(path.read_text(encoding='utf-8'))
          original_type = str(p.get('type', '') or '')
          x_rows = p.get('playlistXTracks') or []

          # The legacy connectivity test dispatches a tiny integration payload
          # without report rows. Turn that event into a local fixture instead
          # of pretending it is a production render.
          if not x_rows and original_type == 'integration_test':
              fixture = Path('renderer/create_fixture.py')
              import subprocess
              subprocess.run(['python', str(fixture)], check=True)
              p = json.loads(Path('fixture_payload.json').read_text(encoding='utf-8'))
              p['generationMode'] = 'integration_test'
              original_type = 'integration_test'

          if not p.get('playlistXTracks'):
              raise SystemExit('payload.json no contiene playlistXTracks')

          if original_type == 'scheduled_render':
              p['type'] = 'real_render_test'

          path.write_text(
              json.dumps(p, ensure_ascii=False, separators=(',', ':')),
              encoding='utf-8'
          )

          print('original payload type:', original_type)
          print('renderer payload type:', p.get('type', ''))
          print('generationMode:', p.get('generationMode', ''))
          print('official tracks:', len(p.get('playlistXTracks') or []))
          print('random tracks: 0')
          print('referenceTime:', p.get('referenceTime', ''))
          PY

      - name: Run Chromium renderer
        run: |
          rm -rf artifacts/real_render_test
          python renderer/renderer_chromium.py \
            payload.json \
            --template renderer/templates/report_template.html \
            --outdir artifacts/real_render_test

      - name: Validate dynamic X-only artifacts
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path
          from PIL import Image

          out = Path('artifacts/real_render_test')
          manifest = json.loads((out / 'manifest.json').read_text(encoding='utf-8'))
          payload = json.loads(Path('payload.json').read_text(encoding='utf-8'))

          x_input = payload.get('playlistXTracks') or []
          input_count = len(x_input)

          assert input_count > 0, 'Playlist X no puede estar vacía'
          assert int(manifest.get('playlistXInputRows', -1)) == input_count, manifest
          assert int(manifest.get('officialRowsUsed', -1)) == input_count, manifest
          assert int(manifest.get('outputRows', -1)) == input_count, manifest
          assert int(manifest.get('randomRowsUsed', 0)) == 0, manifest

          with (out / 'history_real.csv').open(encoding='utf-8', newline='') as f:
              rows = list(csv.DictReader(f))

          assert len(rows) == input_count, (
              f'Expected {input_count} history rows, got {len(rows)}'
          )
          assert all(r.get('origen') == 'playlist_x' for r in rows), \
              'El historial contiene una fila que no pertenece a X'
          assert all(int(r.get('gap_s', '0')) == 0 for r in rows), \
              'Playlist X contiene gaps sintéticos'

          parts = manifest.get('parts') or []
          assert parts, 'No se generaron partes'
          assert [int(p.get('partNumber', 0)) for p in parts] == list(range(1, len(parts) + 1)), \
              'Numeración de partes no consecutiva'
          assert parts[0].get('fileName') == 'report_real.png'
          assert parts[-1].get('endRow') == input_count

          for part in parts:
              n = int(part.get('partNumber', 0))
              path = out / part['fileName']
              assert path.exists(), f'Falta {path.name}'
              img = Image.open(path)
              assert img.width == 1080, f'Parte {n}: ancho inesperado {img.width}'
              if n < len(parts):
                  assert img.height == 1920, (
                      f'Parte {n}: alto inesperado {img.height}; '
                      'las partes no finales deben mantener el viewport completo'
                  )
              else:
                  # La última parte puede medir más de 1920 px cuando
                  # fusionamos un sobrante de 1–3 canciones con la captura anterior.
                  assert 1 <= img.height <= 2880, (
                      f'Última parte: alto inválido {img.height}; máximo permitido 2880'
                  )

          contract = manifest.get('contract') or {}
          assert contract.get('xOnly') is True
          assert contract.get('preserveXLength') is True
          assert contract.get('individualTrackCoversRequired') is True
          assert contract.get('fillerAllowed') is False
          assert contract.get('fixedMasterHeightRequired') is False
          assert contract.get('fixedPartCount') is False
          assert int(contract.get('mergeTailUpToRows', 0)) == 3

          # Deliberately no assertion exists for a fixed master height.
          # The prior failure "Unexpected master size: (1080, 3418)" must not
          # be reintroduced by the workflow.
          print('========================================')
          print('DYNAMIC X-ONLY VALIDATION OK')
          print('X rows:', input_count)
          print('Parts:', len(parts))
          print('Final size:', Image.open(out / parts[-1]['fileName']).size)
          print('Random rows:', manifest.get('randomRowsUsed', 0))
          print('No fixed master-height validation')
          print('========================================')
          PY

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          name: chromium-render-test
          path: artifacts/real_render_test
          if-no-files-found: error
          retention-days: 7

      - name: Send multipart report to Apps Script
        if: github.event_name == 'repository_dispatch' && (github.event.action == 'render_real_test' || github.event.action == 'render_scheduled' || github.event.action == 'render_manual_test')
        env:
          CALLBACK_SECRET: ${{ secrets.RENDER_CALLBACK_SECRET }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          payload = json.loads(Path('payload.json').read_text(encoding='utf-8'))
          out = Path('artifacts/real_render_test')
          manifest = json.loads((out / 'manifest.json').read_text(encoding='utf-8'))

          callback_url = str(payload.get('callbackUrl', '') or '').strip()
          secret = str(os.environ.get('CALLBACK_SECRET', '') or '').strip()
          parts = manifest.get('parts') or []

          # The integration-only connectivity test has no callback URL.
          if not callback_url:
              print('Sin callbackUrl: render de integración completado sin callback.')
              raise SystemExit(0)
          if not secret:
              raise SystemExit('Missing GitHub secret RENDER_CALLBACK_SECRET')

          images = []
          for part in parts:
              path = out / str(part['fileName'])
              if not path.exists():
                  raise SystemExit(f'Missing rendered part: {path.name}')
              images.append({
                  'partNumber': int(part['partNumber']),
                  'fileName': path.name,
                  'mimeType': 'image/png',
                  'imageBase64': base64.b64encode(path.read_bytes()).decode('ascii'),
                  'width': int(part.get('width') or 1080),
                  'height': int(part.get('height') or 0),
                  'startRow': int(part.get('startRow') or 0),
                  'endRow': int(part.get('endRow') or 0),
                  'rowCount': int(part.get('rowCount') or 0),
                  'isFinalPart': bool(part.get('isFinalPart')),
              })

          manifest_official = int(manifest.get('officialRowsUsed') or 0)
          manifest_total = int(manifest.get('outputRows') or 0)

          report_payload = {
              'type': 'report_result',
              'recordId': str(payload.get('recordId', '') or ''),
              'reportId': str(payload.get('reportId', '') or ''),
              'solicitudId': str(payload.get('solicitudId', '') or ''),
              'idAgenda': str(payload.get('idAgenda', payload.get('agendaId', '')) or ''),
              'playlistName': str(payload.get('playlistName', 'Playlist') or 'Playlist'),
              'referenceTime': str(payload.get('referenceTime', '') or ''),
              'generatedAt': str(payload.get('generatedAt', '') or ''),
              'generationMode': str(payload.get('generationMode', 'manual') or 'manual'),
              'finalTimeHHMM': str(payload.get('finalTimeHHMM', '') or ''),
              'officialCount': manifest_official,
              'randomCount': 0,
              'totalRows': manifest_total,
              'partsCount': len(images),
              'images': images,
              'xOnly': True,
          }

          separator = '&' if '?' in callback_url else '?'
          url = callback_url + separator + urllib.parse.urlencode({'key': secret})
          body = json.dumps(report_payload, ensure_ascii=False, separators=(',', ':')).encode('utf-8')

          req = urllib.request.Request(
              url,
              data=body,
              headers={
                  'Content-Type': 'application/json',
                  'Accept': 'application/json',
                  'User-Agent': 'GitHubActions-SpotifyReportRenderer/2.0',
              },
              method='POST',
          )

          try:
              with urllib.request.urlopen(req, timeout=180) as response:
                  status = response.status
                  response_body = response.read().decode('utf-8', errors='replace')
          except Exception as exc:
              raise SystemExit(f'Callback request failed: {exc}')

          print('Apps Script callback HTTP:', status)
          print('Apps Script callback response:', response_body[:4000])

          if status < 200 or status >= 300:
              raise SystemExit(f'Apps Script callback returned HTTP {status}')

          result = json.loads(response_body)
          if result.get('ok') is not True:
              raise SystemExit(f'Apps Script callback reported failure: {result}')

          print('MULTIPART CALLBACK OK')
          print('Saved primary path:', result.get('fileName', ''))
          print('Manifest Drive file id:', result.get('manifestFileId', ''))
          print('Parts:', result.get('partsCount', len(images)))
          PY

    concurrency:
      group: spotify-report-${{ github.event.client_payload.reportId || github.event.client_payload.solicitudId || github.event.client_payload.idAgenda || github.run_id }}
      cancel-in-progress: false
