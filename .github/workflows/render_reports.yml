{
  "name": "Render Spotify Reports",
  "on": {
    "workflow_dispatch": {},
    "repository_dispatch": {
      "types": [
        "render_real_test",
        "render_scheduled",
        "render_manual_test"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "renderer-test": {
      "name": "Chromium render + Apps Script callback",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "steps": [
        {
          "name": "Checkout repository",
          "uses": "actions/checkout@v7"
        },
        {
          "name": "Setup Python 3.13",
          "uses": "actions/setup-python@v7",
          "with": {
            "python-version": "3.13"
          }
        },
        {
          "name": "Install Python packages",
          "run": "python -m pip install --upgrade pip\npython -m pip install -r renderer/requirements.txt"
        },
        {
          "name": "Install Chromium",
          "run": "python -m playwright install --with-deps --no-shell chromium"
        },
        {
          "name": "Prepare payload",
          "env": {
            "PAYLOAD_JSON": "${{ toJson(github.event.client_payload) }}"
          },
          "run": "if [ \"${{ github.event_name }}\" = \"repository_dispatch\" ]; then\n  printf '%s' \"$PAYLOAD_JSON\" > payload.json\nelse\n  python renderer/create_fixture.py\n  mv fixture_payload.json payload.json\nfi\npython -m json.tool payload.json >/dev/null\npython - <<'PY2'\nimport json\nfrom pathlib import Path\np=json.loads(Path('payload.json').read_text(encoding='utf-8'))\nprint('payload type:', p.get('type'))\nprint('official tracks:', len(p.get('playlistXTracks', [])))\nprint('random tracks:', len(p.get('fillerTracks', [])))\nPY2"
        },
        {
          "name": "Run Chromium renderer",
          "run": "rm -rf artifacts/real_render_test\npython renderer/renderer_chromium.py payload.json --template renderer/templates/report_template.html --outdir artifacts/real_render_test"
        },
        {
          "name": "Validate artifacts",
          "run": "python - <<'PY3'\nimport csv\nimport json\nfrom pathlib import Path\nfrom PIL import Image\n\nout = Path('artifacts/real_render_test')\nmanifest = json.loads((out / 'manifest.json').read_text(encoding='utf-8'))\npayload = json.loads(Path('payload.json').read_text(encoding='utf-8'))\n\nimg = Image.open(out / 'report_real.png')\nassert img.size == (1445, 2047), f'Unexpected PNG size: {img.size}'\n\nwith (out / 'history_real.csv').open(encoding='utf-8', newline='') as f:\n    rows = list(csv.DictReader(f))\n\nx_input = len(payload.get('playlistXTracks', []))\nx_used = min(x_input, 50)\nrandom_expected = max(0, 50 - x_used)\n\nassert len(rows) == 50, f'Expected 50 rows, got {len(rows)}'\nofficial = [r for r in rows if r['origen'] == 'playlist_x']\nrandom_rows = [r for r in rows if r['origen'] == 'random']\n\nassert len(official) == x_used, f'Expected {x_used} official rows, got {len(official)}'\nassert len(random_rows) == random_expected, f'Expected {random_expected} random rows, got {len(random_rows)}'\nassert all(int(r['gap_s']) == 0 for r in official), 'Playlist X contains synthetic gaps'\n\nif random_rows:\n    max_gap = max(int(r['gap_s']) for r in random_rows)\n    print('Random max gap:', max_gap, 'seconds')\n\nprint('')\nprint('========================================')\nprint('CHROMIUM VALIDATION OK')\nprint('========================================')\nprint('PNG:', img.size)\nprint('Total rows:', len(rows))\nprint('Official:', len(official))\nprint('Random:', len(random_rows))\nprint('Expected official:', x_used)\nprint('Expected random:', random_expected)\nprint('Manifest renderer:', manifest.get('renderer'))\nprint('========================================')\nPY3"
        },
        {
          "name": "Upload test artifacts",
          "uses": "actions/upload-artifact@v7",
          "with": {
            "name": "chromium-render-test",
            "path": "artifacts/real_render_test",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        },
        {
          "name": "Send PNG to Apps Script",
          "env": {
            "CALLBACK_SECRET": "${{ secrets.RENDER_CALLBACK_SECRET }}"
          },
          "run": "python - <<'PY4'\nimport base64\nimport json\nimport os\nimport urllib.parse\nimport urllib.request\nfrom pathlib import Path\n\npayload = json.loads(Path('payload.json').read_text(encoding='utf-8'))\nout = Path('artifacts/real_render_test')\nimage_path = out / 'report_real.png'\n\ncallback_url = str(payload.get('callbackUrl', '')).strip()\nsecret = os.environ.get('CALLBACK_SECRET', '').strip()\n\nif not callback_url:\n    raise SystemExit('Missing payload.callbackUrl')\nif not secret:\n    raise SystemExit('Missing GitHub secret RENDER_CALLBACK_SECRET')\nif not image_path.exists():\n    raise SystemExit('Missing report_real.png')\n\n# Apps Script web apps expose doPost(e). We send the image as base64 JSON.\n# The PNG is already validated before this step.\nimage_b64 = base64.b64encode(image_path.read_bytes()).decode('ascii')\n\nwith (out / 'history_real.csv').open(encoding='utf-8', newline='') as f:\n    import csv\n    rows = list(csv.DictReader(f))\n\nofficial_count = sum(1 for r in rows if r.get('origen') == 'playlist_x')\nrandom_count = sum(1 for r in rows if r.get('origen') == 'random')\n\nreport_payload = {\n    'type': 'report_result',\n    'recordId': payload.get('recordId', ''),\n    'playlistName': payload.get('playlistName', 'Playlist'),\n    'referenceTime': payload.get('referenceTime', ''),\n    'generatedAt': payload.get('generatedAt', ''),\n    'officialCount': official_count,\n    'randomCount': random_count,\n    'totalRows': len(rows),\n    'imageFileName': image_path.name,\n    'imageBase64': image_b64,\n}\n\nseparator = '&' if '?' in callback_url else '?'\nurl = callback_url + separator + urllib.parse.urlencode({'key': secret})\n\nbody = json.dumps(report_payload).encode('utf-8')\nreq = urllib.request.Request(\n    url,\n    data=body,\n    headers={\n        'Content-Type': 'application/json',\n        'Accept': 'application/json',\n        'User-Agent': 'GitHubActions-SpotifyReportRenderer/1.0',\n    },\n    method='POST',\n)\n\ntry:\n    with urllib.request.urlopen(req, timeout=120) as response:\n        status = response.status\n        response_body = response.read().decode('utf-8', errors='replace')\nexcept Exception as exc:\n    raise SystemExit(f'Callback request failed: {exc}')\n\nprint('Apps Script callback HTTP:', status)\nprint('Apps Script callback response:', response_body[:2000])\n\nif status < 200 or status >= 300:\n    raise SystemExit(f'Apps Script callback returned HTTP {status}')\n\nresult = json.loads(response_body)\nif result.get('ok') is not True:\n    raise SystemExit(f'Apps Script callback reported failure: {result}')\n\nprint('CALLBACK OK')\nprint('Saved relative image path:', result.get('fileName', ''))\nprint('Drive file id:', result.get('fileId', ''))\nPY4",
          "if": "${{ github.event_name == 'repository_dispatch' && github.event.action == 'render_real_test' }}"
        }
      ]
    }
  }
}
