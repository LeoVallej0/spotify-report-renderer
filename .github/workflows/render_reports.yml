{
  "name": "Render Spotify Reports",
  "on": {
    "workflow_dispatch": {},
    "repository_dispatch": {
      "types": [
        "render_real_test",
        "render_scheduled",
        "render_manual_test"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "renderer-test": {
      "name": "Chromium headless report renderer - CURRENT STATS STYLE 50 ROWS",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "steps": [
        {
          "name": "Checkout repository",
          "uses": "actions/checkout@v7"
        },
        {
          "name": "Setup Python 3.13",
          "uses": "actions/setup-python@v7",
          "with": {
            "python-version": "3.13",
            "cache": "pip",
            "cache-dependency-path": "renderer/requirements.txt"
          }
        },
        {
          "name": "Install Python packages",
          "run": "python -m pip install -r renderer/requirements.txt"
        },
        {
          "name": "Cache Chromium",
          "uses": "actions/cache@v6",
          "id": "playwright-cache",
          "with": {
            "path": "~/.cache/ms-playwright",
            "key": "${{ runner.os }}-playwright-chromium-${{ hashFiles('renderer/requirements.txt') }}",
            "restore-keys": "${{ runner.os }}-playwright-chromium-"
          }
        },
        {
          "name": "Install Chromium (cache miss)",
          "if": "steps.playwright-cache.outputs.cache-hit != 'true'",
          "run": "python -m playwright install --with-deps chromium"
        },
        {
          "name": "Verify Playwright Chromium",
          "run": "python - <<'PYCHK'\nfrom playwright.sync_api import sync_playwright\nwith sync_playwright() as p:\n    browser = p.chromium.launch(headless=True, args=['--no-sandbox', '--disable-dev-shm-usage'])\n    browser.close()\nprint('PLAYWRIGHT CHROMIUM OK')\nPYCHK"
        },
        {
          "name": "Prepare payload",
          "env": {
            "PAYLOAD_JSON": "${{ toJson(github.event.client_payload) }}"
          },
          "run": "if [ \"${{ github.event_name }}\" = \"repository_dispatch\" ]; then\n  printf '%s' \"$PAYLOAD_JSON\" > payload.json\nelse\n  python renderer/create_fixture.py\n  mv fixture_payload.json payload.json\nfi\n\npython -m json.tool payload.json >/dev/null\n\npython - <<'PY2'\nimport json\nfrom pathlib import Path\n\npath = Path(\"payload.json\")\np = json.loads(path.read_text(encoding=\"utf-8\"))\n\noriginal_type = p.get(\"type\", \"\")\n\n# El renderer Chromium existente valida type=real_render_test.\n# Para repository_dispatch de producción/prueba programada,\n# mantenemos generationMode para que el callback conozca el modo.\nif original_type == \"scheduled_render\":\n    p[\"type\"] = \"real_render_test\"\n\npath.write_text(\n    json.dumps(p, ensure_ascii=False, separators=(\",\", \":\")),\n    encoding=\"utf-8\"\n)\n\nprint(\"original payload type:\", original_type)\nprint(\"renderer payload type:\", p.get(\"type\"))\nprint(\"generationMode:\", p.get(\"generationMode\", \"\"))\nprint(\"official tracks:\", len(p.get(\"playlistXTracks\", [])))\nprint(\"random tracks:\", len(p.get(\"fillerTracks\", [])))\nprint(\"referenceTime:\", p.get(\"referenceTime\", \"\"))\nPY2"
        },
        {
          "name": "Run Chromium renderer",
          "run": "rm -rf artifacts/real_render_test\npython renderer/renderer_chromium.py payload.json --template renderer/templates/report_template.html --outdir artifacts/real_render_test"
        },
        {
          "name": "Inspect high-resolution output",
          "run": "python - <<'PYHIRES'\nfrom pathlib import Path\nfrom PIL import Image\np=Path(\"artifacts/real_render_test/report_real.png\")\nimg=Image.open(p)\nprint(\"High-resolution PNG:\", img.size)\nprint(\"File size:\", p.stat().st_size, \"bytes\")\nPYHIRES"
        },
        {
          "name": "Validate artifacts",
          "run": "python - <<'PY3'\nimport csv\nimport json\nfrom pathlib import Path\nfrom PIL import Image, ImageChops\n\nout = Path(\"artifacts/real_render_test\")\nmanifest = json.loads((out / \"manifest.json\").read_text(encoding=\"utf-8\"))\npayload = json.loads(Path(\"payload.json\").read_text(encoding=\"utf-8\"))\n\nimg = Image.open(out / \"report_real.png\").convert(\"RGB\")\nassert img.width == 2890, f\"Unexpected PNG width: {img.width}; expected 2890\"\nassert img.height > 3000, f\"Rendered report is unexpectedly short: {img.height}px\"\n\n# Safety check: the rendered report must contain visible content.\nbg = Image.new(\"RGB\", img.size, (255, 255, 255))\nbbox = ImageChops.difference(img, bg).getbbox()\nassert bbox is not None, \"Final PNG is completely white\"\n\nwith (out / \"history_real.csv\").open(encoding=\"utf-8\", newline=\"\") as f:\n    rows = list(csv.DictReader(f))\n\nx_input = len(payload.get(\"playlistXTracks\", []))\nassert x_input <= 50, f\"Playlist X has {x_input} tracks; X must not be truncated or altered.\"\nrandom_expected = 50 - x_input\n\nassert len(rows) == 50, f\"Expected 50 rows, got {len(rows)}\"\nofficial = [r for r in rows if r[\"origen\"] == \"playlist_x\"]\nrandom_rows = [r for r in rows if r[\"origen\"] == \"random\"]\n\nassert len(official) == x_input, f\"Expected {x_input} official rows, got {len(official)}\"\nassert len(random_rows) == random_expected, f\"Expected {random_expected} random rows, got {len(random_rows)}\"\nassert all(int(r[\"gap_s\"]) == 0 for r in official), \"Playlist X contains synthetic gaps\"\n\nif random_rows:\n    max_gap = max(int(r[\"gap_s\"]) for r in random_rows)\n    print(\"Random max gap:\", max_gap, \"seconds\")\n\nprint(\"\")\nprint(\"========================================\")\nprint(\"CHROMIUM HIRES VALIDATION OK\")\nprint(\"========================================\")\nprint(\"PNG:\", img.size)\nprint(\"Visible bbox:\", bbox)\nprint(\"Total rows:\", len(rows))\nprint(\"Official:\", len(official))\nprint(\"Random:\", len(random_rows))\nprint(\"Expected official:\", x_input)\nprint(\"Expected random:\", random_expected)\nprint(\"Device scale factor:\", manifest.get(\"deviceScaleFactor\"))\nprint(\"Crop:\", manifest.get(\"crop\"))\nprint(\"========================================\")\nPY3"
        },
        {
          "name": "Upload test artifacts",
          "uses": "actions/upload-artifact@v7",
          "with": {
            "name": "chromium-render-test",
            "path": "artifacts/real_render_test",
            "if-no-files-found": "error",
            "retention-days": 7
          },
          "if": "${{ github.event_name == 'workflow_dispatch' }}"
        },
        {
          "name": "Send PNG to Apps Script",
          "env": {
            "CALLBACK_SECRET": "${{ secrets.RENDER_CALLBACK_SECRET }}"
          },
          "run": "python - <<'PY4'\nimport base64\nimport csv\nimport json\nimport os\nimport urllib.parse\nimport urllib.request\nfrom pathlib import Path\n\npayload = json.loads(Path(\"payload.json\").read_text(encoding=\"utf-8\"))\nout = Path(\"artifacts/real_render_test\")\nimage_path = out / \"report_real.png\"\n\ncallback_url = str(payload.get(\"callbackUrl\", \"\")).strip()\nsecret = os.environ.get(\"CALLBACK_SECRET\", \"\").strip()\n\nif not callback_url:\n    raise SystemExit(\"Missing payload.callbackUrl\")\nif not secret:\n    raise SystemExit(\"Missing GitHub secret RENDER_CALLBACK_SECRET\")\nif not image_path.exists():\n    raise SystemExit(\"Missing report_real.png\")\n\nimage_b64 = base64.b64encode(image_path.read_bytes()).decode(\"ascii\")\n\nwith (out / \"history_real.csv\").open(encoding=\"utf-8\", newline=\"\") as f:\n    rows = list(csv.DictReader(f))\n\nofficial_count = sum(1 for r in rows if r.get(\"origen\") == \"playlist_x\")\nrandom_count = sum(1 for r in rows if r.get(\"origen\") == \"random\")\n\nreport_payload = {\n    \"type\": \"report_result\",\n    \"recordId\": payload.get(\"recordId\", \"\"),\n    \"playlistName\": payload.get(\"playlistName\", \"Playlist\"),\n    \"referenceTime\": payload.get(\"referenceTime\", \"\"),\n    \"generatedAt\": payload.get(\"generatedAt\", \"\"),\n    \"generationMode\": payload.get(\"generationMode\", \"manual\"),\n    \"finalTimeHHMM\": payload.get(\"finalTimeHHMM\", \"\"),\n    \"officialCount\": official_count,\n    \"randomCount\": random_count,\n    \"totalRows\": len(rows),\n    \"imageFileName\": image_path.name,\n    \"imageBase64\": image_b64,\n}\n\nseparator = \"&\" if \"?\" in callback_url else \"?\"\nurl = callback_url + separator + urllib.parse.urlencode({\"key\": secret})\n\nbody = json.dumps(report_payload).encode(\"utf-8\")\nreq = urllib.request.Request(\n    url,\n    data=body,\n    headers={\n        \"Content-Type\": \"application/json\",\n        \"Accept\": \"application/json\",\n        \"User-Agent\": \"GitHubActions-SpotifyReportRenderer/1.0\",\n    },\n    method=\"POST\",\n)\n\ntry:\n    with urllib.request.urlopen(req, timeout=120) as response:\n        status = response.status\n        response_body = response.read().decode(\"utf-8\", errors=\"replace\")\nexcept Exception as exc:\n    raise SystemExit(f\"Callback request failed: {exc}\")\n\nprint(\"Apps Script callback HTTP:\", status)\nprint(\"Apps Script callback response:\", response_body[:2000])\n\nif status < 200 or status >= 300:\n    raise SystemExit(f\"Apps Script callback returned HTTP {status}\")\n\nresult = json.loads(response_body)\nif result.get(\"ok\") is not True:\n    raise SystemExit(f\"Apps Script callback reported failure: {result}\")\n\nprint(\"CALLBACK OK\")\nprint(\"Saved relative image path:\", result.get(\"fileName\", \"\"))\nprint(\"Drive file id:\", result.get(\"fileId\", \"\"))\nPY4",
          "if": "${{ github.event_name == 'repository_dispatch' && (github.event.action == 'render_real_test' || github.event.action == 'render_scheduled') }}"
        }
      ],
      "concurrency": {
        "group": "spotify-report-${{ github.event.client_payload.recordId || github.run_id }}",
        "cancel-in-progress": true
      }
    }
  }
}
