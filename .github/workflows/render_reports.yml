{
  "name": "Spotify report renderer - V16 X-only 3 parts",
  "on": {
    "workflow_dispatch": {},
    "repository_dispatch": {
      "types": [
        "render_real_test",
        "render_scheduled",
        "render_manual_test"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "renderer-test": {
      "name": "Chromium headless - X only - 3 mobile parts",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "steps": [
        {
          "name": "Checkout repository",
          "uses": "actions/checkout@v7"
        },
        {
          "name": "Setup Python 3.13",
          "uses": "actions/setup-python@v7",
          "with": {
            "python-version": "3.13",
            "cache": "pip",
            "cache-dependency-path": "renderer/requirements.txt"
          }
        },
        {
          "name": "Install Python packages",
          "run": "python -m pip install -r renderer/requirements.txt"
        },
        {
          "name": "Cache Chromium",
          "uses": "actions/cache@v6",
          "id": "playwright-cache",
          "with": {
            "path": "~/.cache/ms-playwright",
            "key": "${{ runner.os }}-playwright-chromium-v15-${{ hashFiles('renderer/requirements.txt') }}",
            "restore-keys": "${{ runner.os }}-playwright-chromium-v15-"
          }
        },
        {
          "name": "Install Chromium (cache miss)",
          "if": "steps.playwright-cache.outputs.cache-hit != 'true'",
          "run": "python -m playwright install --with-deps chromium"
        },
        {
          "name": "Verify Playwright Chromium",
          "run": "python - <<'PYCHK'\nfrom playwright.sync_api import sync_playwright\nwith sync_playwright() as p:\n    browser = p.chromium.launch(headless=True, args=['--no-sandbox', '--disable-dev-shm-usage'])\n    browser.close()\nprint('PLAYWRIGHT CHROMIUM OK')\nPYCHK"
        },
        {
          "name": "Prepare payload",
          "env": {
            "PAYLOAD_JSON": "${{ toJson(github.event.client_payload) }}"
          },
          "run": "if [ \"${{ github.event_name }}\" = \"repository_dispatch\" ]; then\n  printf '%s' \"$PAYLOAD_JSON\" > payload.json\nelse\n  cp fixture_payload.json payload.json\nfi\n\npython -m json.tool payload.json >/dev/null\n\npython - <<'PY2'\nimport json\nfrom pathlib import Path\n\npath = Path('payload.json')\np = json.loads(path.read_text(encoding='utf-8'))\noriginal_type = p.get('type', '')\nif original_type == 'scheduled_render':\n    p['type'] = 'real_render_test'\n\n# V16 es estrictamente X-only. No se acepta relleno/random.\nfiller = p.get('fillerTracks') or []\nif filler:\n    raise SystemExit(f'V16 rejects fillerTracks: received {len(filler)} random tracks')\n\nx = p.get('playlistXTracks') or []\nif not x:\n    raise SystemExit('V16 requires playlistXTracks')\n\npath.write_text(json.dumps(p, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')\nprint('original payload type:', original_type)\nprint('renderer payload type:', p.get('type'))\nprint('generationMode:', p.get('generationMode', ''))\nprint('Playlist X tracks:', len(x))\nprint('Random tracks:', 0)\nprint('referenceTime:', p.get('referenceTime', ''))\nPY2"
        },
        {
          "name": "Run Chromium renderer",
          "run": "rm -rf artifacts/real_render_test\npython renderer/renderer_chromium.py payload.json --template renderer/templates/report_template.html --outdir artifacts/real_render_test"
        },
        {
          "name": "Validate V16 output",
          "run": "python - <<'PY3'\nimport csv\nimport json\nfrom pathlib import Path\nfrom PIL import Image, ImageChops\n\nout = Path('artifacts/real_render_test')\npayload = json.loads(Path('payload.json').read_text(encoding='utf-8'))\nmanifest = json.loads((out / 'manifest.json').read_text(encoding='utf-8'))\n\nx_input = len(payload.get('playlistXTracks', []))\nassert x_input > 0\nassert not (payload.get('fillerTracks') or [])\n\nmaster = Image.open(out / 'report_real.png').convert('RGB')\nassert master.size == (1080, 5760), f'Unexpected master size: {master.size}'\n\nparts = sorted(out.glob('report_part_*.png'))\nassert len(parts) == 3, f'Expected 3 parts, found {len(parts)}'\nfor i, p in enumerate(parts, 1):\n    img = Image.open(p).convert('RGB')\n    assert img.size == (1080, 1920), f'Part {i}: {img.size}'\n    bbox = ImageChops.difference(img, Image.new('RGB', img.size, 'white')).getbbox()\n    assert bbox is not None, f'Part {i} is completely white'\n\nwith (out / 'history_real.csv').open(encoding='utf-8', newline='') as f:\n    rows = list(csv.DictReader(f))\n\nassert len(rows) == x_input, f'CSV rows {len(rows)} != X {x_input}'\nassert all(r['origen'] == 'playlist_x' for r in rows)\nassert all(int(r['gap_s']) == 0 for r in rows)\nassert all(r.get('image_url', '') for r in rows), 'Some X rows are missing individual artwork URL'\n\nassert manifest['parts'] == 3\nassert manifest['partSize'] == [1080, 1920]\nassert manifest['randomRowsUsed'] == 0\nassert manifest['officialRowsUsed'] == x_input\n\nprint('========================================')\nprint('V16 VALIDATION OK')\nprint('========================================')\nprint('Master:', master.size)\nprint('Parts:', [Image.open(p).size for p in parts])\nprint('X rows:', x_input)\nprint('Artwork URLs:', sum(1 for r in rows if r.get('image_url')))\nprint('Part row counts:', manifest.get('partRowCounts'))\nprint('========================================')\nPY3"
        },
        {
          "name": "Upload test artifacts",
          "uses": "actions/upload-artifact@v7",
          "with": {
            "name": "chromium-v15-x-only-3-parts",
            "path": "artifacts/real_render_test",
            "if-no-files-found": "error",
            "retention-days": 7
          },
          "if": "${{ github.event_name == 'workflow_dispatch' }}"
        },
        {
          "name": "Send master PNG to Apps Script",
          "env": {
            "CALLBACK_SECRET": "${{ secrets.RENDER_CALLBACK_SECRET }}"
          },
          "run": "python - <<'PY4'\nimport base64\nimport csv\nimport json\nimport os\nimport urllib.parse\nimport urllib.request\nfrom pathlib import Path\n\npayload = json.loads(Path('payload.json').read_text(encoding='utf-8'))\nout = Path('artifacts/real_render_test')\nimage_path = out / 'report_real.png'\ncallback_url = str(payload.get('callbackUrl', '')).strip()\nsecret = os.environ.get('CALLBACK_SECRET', '').strip()\n\nif not callback_url:\n    raise SystemExit('Missing payload.callbackUrl')\nif not secret:\n    raise SystemExit('Missing GitHub secret RENDER_CALLBACK_SECRET')\n\nimage_b64 = base64.b64encode(image_path.read_bytes()).decode('ascii')\nwith (out / 'history_real.csv').open(encoding='utf-8', newline='') as f:\n    rows = list(csv.DictReader(f))\n\nofficial_count = sum(1 for r in rows if r.get('origen') == 'playlist_x')\n\nreport_payload = {\n    'type': 'report_result',\n    'recordId': payload.get('recordId', ''),\n    'playlistName': payload.get('playlistName', 'Playlist'),\n    'referenceTime': payload.get('referenceTime', ''),\n    'generatedAt': payload.get('generatedAt', ''),\n    'generationMode': payload.get('generationMode', 'manual'),\n    'finalTimeHHMM': payload.get('finalTimeHHMM', ''),\n    'officialCount': official_count,\n    'randomCount': 0,\n    'totalRows': len(rows),\n    'imageFileName': image_path.name,\n    'imageBase64': image_b64,\n}\n\nseparator = '&' if '?' in callback_url else '?'\nurl = callback_url + separator + urllib.parse.urlencode({'key': secret})\nbody = json.dumps(report_payload).encode('utf-8')\nreq = urllib.request.Request(url, data=body, headers={'Content-Type':'application/json','Accept':'application/json','User-Agent':'GitHubActions-SpotifyReportRenderer/1.0'}, method='POST')\n\ntry:\n    with urllib.request.urlopen(req, timeout=120) as response:\n        status = response.status\n        response_body = response.read().decode('utf-8', errors='replace')\nexcept Exception as exc:\n    raise SystemExit(f'Callback request failed: {exc}')\n\nprint('Apps Script callback HTTP:', status)\nprint('Apps Script callback response:', response_body[:2000])\nif status < 200 or status >= 300:\n    raise SystemExit(f'Apps Script callback returned HTTP {status}')\nresult = json.loads(response_body)\nif result.get('ok') is not True:\n    raise SystemExit(f'Apps Script callback reported failure: {result}')\nprint('CALLBACK OK')\nprint('Saved relative image path:', result.get('fileName', ''))\nprint('Drive file id:', result.get('fileId', ''))\nPY4",
          "if": "${{ github.event_name == 'repository_dispatch' && (github.event.action == 'render_real_test' || github.event.action == 'render_scheduled') }}"
        }
      ],
      "concurrency": {
        "group": "spotify-report-${{ github.event.client_payload.recordId || github.run_id }}",
        "cancel-in-progress": true
      }
    }
  }
}
