{
  "name": "Render Spotify Reports",
  "on": {
    "workflow_dispatch": {},
    "repository_dispatch": {
      "types": [
        "render_real_test",
        "render_scheduled",
        "render_manual_test"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "renderer-test": {
      "name": "Chromium headless 50-row test",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "steps": [
        {
          "name": "Checkout repository",
          "uses": "actions/checkout@v7"
        },
        {
          "name": "Setup Python 3.13",
          "uses": "actions/setup-python@v7",
          "with": {
            "python-version": "3.13"
          }
        },
        {
          "name": "Install Python packages",
          "run": "python -m pip install --upgrade pip\npython -m pip install -r renderer/requirements.txt"
        },
        {
          "name": "Install Chromium",
          "run": "python -m playwright install --with-deps --no-shell chromium"
        },
        {
          "name": "Prepare payload",
          "env": {
            "PAYLOAD_JSON": "${{ toJson(github.event.client_payload) }}"
          },
          "run": "if [ \"${{ github.event_name }}\" = \"repository_dispatch\" ]; then\n  printf '%s' \"$PAYLOAD_JSON\" > payload.json\nelse\n  python renderer/create_fixture.py\n  mv fixture_payload.json payload.json\nfi\npython -m json.tool payload.json >/dev/null\npython - <<'PY2'\nimport json\nfrom pathlib import Path\np=json.loads(Path('payload.json').read_text(encoding='utf-8'))\nprint('payload type:', p.get('type'))\nprint('official tracks:', len(p.get('playlistXTracks', [])))\nprint('random tracks:', len(p.get('fillerTracks', [])))\nPY2"
        },
        {
          "name": "Run Chromium renderer",
          "run": "rm -rf artifacts/real_render_test\npython renderer/renderer_chromium.py payload.json --template renderer/templates/report_template.html --outdir artifacts/real_render_test"
        },
        {
          "name": "Validate artifacts",
          "run": "python - <<'PY3'\nimport csv\nimport json\nfrom pathlib import Path\nfrom PIL import Image\n\nout = Path('artifacts/real_render_test')\nmanifest = json.loads((out / 'manifest.json').read_text(encoding='utf-8'))\npayload = json.loads(Path('payload.json').read_text(encoding='utf-8'))\n\nimg = Image.open(out / 'report_real.png')\nassert img.size == (1445, 2047), f'Unexpected PNG size: {img.size}'\n\nwith (out / 'history_real.csv').open(encoding='utf-8', newline='') as f:\n    rows = list(csv.DictReader(f))\n\nx_input = len(payload.get('playlistXTracks', []))\nx_used = min(x_input, 50)\nrandom_expected = max(0, 50 - x_used)\n\nassert len(rows) == 50, f'Expected 50 rows, got {len(rows)}'\nofficial = [r for r in rows if r['origen'] == 'playlist_x']\nrandom_rows = [r for r in rows if r['origen'] == 'random']\n\nassert len(official) == x_used, f'Expected {x_used} official rows, got {len(official)}'\nassert len(random_rows) == random_expected, f'Expected {random_expected} random rows, got {len(random_rows)}'\nassert all(int(r['gap_s']) == 0 for r in official), 'Playlist X contains synthetic gaps'\n\nif random_rows:\n    max_gap = max(int(r['gap_s']) for r in random_rows)\n    print('Random max gap:', max_gap, 'seconds')\n\nprint('')\nprint('========================================')\nprint('CHROMIUM VALIDATION OK')\nprint('========================================')\nprint('PNG:', img.size)\nprint('Total rows:', len(rows))\nprint('Official:', len(official))\nprint('Random:', len(random_rows))\nprint('Expected official:', x_used)\nprint('Expected random:', random_expected)\nprint('Manifest renderer:', manifest.get('renderer'))\nprint('========================================')\nPY3"
        },
        {
          "name": "Upload test artifacts",
          "uses": "actions/upload-artifact@v7",
          "with": {
            "name": "chromium-render-test",
            "path": "artifacts/real_render_test",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        }
      ]
    }
  }
}
