{
  "name": "Render Spotify Reports",
  "on": {
    "workflow_dispatch": {},
    "repository_dispatch": {
      "types": [
        "render_real_test",
        "render_scheduled",
        "render_manual_test"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "renderer-test": {
      "name": "Chromium headless 50-row test",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "steps": [
        {
          "name": "Checkout repository",
          "uses": "actions/checkout@v7"
        },
        {
          "name": "Setup Python 3.13",
          "uses": "actions/setup-python@v7",
          "with": {
            "python-version": "3.13"
          }
        },
        {
          "name": "Install Python packages",
          "run": "python -m pip install --upgrade pip\npython -m pip install -r renderer/requirements.txt"
        },
        {
          "name": "Install Chromium",
          "run": "python -m playwright install --with-deps --no-shell chromium"
        },
        {
          "name": "Prepare payload",
          "env": {
            "PAYLOAD_JSON": "${{ toJson(github.event.client_payload) }}"
          },
          "run": "if [ \"${{ github.event_name }}\" = \"repository_dispatch\" ]; then\n  printf '%s' \"$PAYLOAD_JSON\" > payload.json\nelse\n  python renderer/create_fixture.py\n  mv fixture_payload.json payload.json\nfi\npython -m json.tool payload.json >/dev/null\npython - <<'PY'\nimport json\np=json.load(open('payload.json',encoding='utf-8'))\nprint('payload type:', p.get('type'))\nprint('official tracks:', len(p.get('playlistXTracks', [])))\nprint('random pool/filler tracks:', len(p.get('fillerTracks', [])))\nPY"
        },
        {
          "name": "Run Chromium renderer",
          "run": "rm -rf artifacts/real_render_test\npython renderer/renderer_chromium.py payload.json --template renderer/templates/report_template.html --outdir artifacts/real_render_test"
        },
        {
{
  "name": "Validate artifacts",
  "run": "python - <<'PY'\nimport csv\nimport json\nfrom pathlib import Path\nfrom PIL import Image\n\nout = Path('artifacts/real_render_test')\n\nmanifest = json.loads(\n    (out / 'manifest.json').read_text(encoding='utf-8')\n)\n\npayload = json.loads(\n    Path('payload.json').read_text(encoding='utf-8')\n)\n\nimg = Image.open(out / 'report_real.png')\n\nassert img.size == (1445, 2047), img.size\n\nwith (out / 'history_real.csv').open(encoding='utf-8') as f:\n    rows = list(csv.DictReader(f))\n\nassert len(rows) == 50, len(rows)\n\nx_input = len(payload.get('playlistXTracks', []))\nexpected_official = min(x_input, 50)\nexpected_random = max(0, 50 - expected_official)\n\nofficial = [\n    r for r in rows\n    if r['origen'] == 'playlist_x'\n]\n\nrandom_rows = [\n    r for r in rows\n    if r['origen'] == 'random'\n]\n\nassert len(official) == expected_official, (\n    f'Expected {expected_official} official rows, got {len(official)}'\n)\n\nassert len(random_rows) == expected_random, (\n    f'Expected {expected_random} random rows, got {len(random_rows)}'\n)\n\n# Playlist X must have NO synthetic gaps.\nassert all(\n    int(r['gap_s']) == 0\n    for r in official\n), 'Playlist X contains a synthetic gap.'\n\n# Random block should contain variable timing.\nif random_rows:\n    max_gap = max(\n        int(r['gap_s'])\n        for r in random_rows\n    )\n\n    print(\n        'Random max gap:',\n        max_gap,\n        'seconds'\n    )\n\n    assert max_gap > 120, (\n        'Random block did not produce a gap greater than 120 seconds.'\n    )\nelse:\n    print('No random filler required.')\n\nprint('')\nprint('========================================')\nprint('CHROMIUM VALIDATION OK')\nprint('========================================')\nprint('PNG:', img.size)\nprint('Total rows:', len(rows))\nprint('Playlist X rows:', len(official))\nprint('Random rows:', len(random_rows))\nprint('Expected X:', expected_official)\nprint('Expected random:', expected_random)\nprint('========================================')\nPY"
},
        {
          "name": "Upload test artifacts",
          "uses": "actions/upload-artifact@v7",
          "with": {
            "name": "chromium-render-test",
            "path": "artifacts/real_render_test",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        }
      ]
    }
  }
}
