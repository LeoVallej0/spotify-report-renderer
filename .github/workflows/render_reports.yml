{
  "name": "Render Spotify Reports",
  "on": {
    "workflow_dispatch": {},
    "repository_dispatch": {
      "types": [
        "render_scheduled",
        "render_manual_test"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "integration-test": {
      "name": "Apps Script → GitHub test",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "Show event",
          "env": {
            "EVENT_NAME": "${{ github.event_name }}",
            "EVENT_TYPE": "${{ github.event.action }}",
            "PAYLOAD_JSON": "${{ toJson(github.event.client_payload) }}"
          },
          "run": "echo \"EVENT_NAME=$EVENT_NAME\"\necho \"EVENT_TYPE=$EVENT_TYPE\"\necho \"PAYLOAD=$PAYLOAD_JSON\""
        },
        {
          "name": "Validate repository dispatch",
          "if": "${{ github.event_name == 'repository_dispatch' }}",
          "env": {
            "PAYLOAD_JSON": "${{ toJson(github.event.client_payload) }}"
          },
          "run": "python - <<'PY'\nimport json, os\n\nraw = os.environ.get('PAYLOAD_JSON', '').strip()\npayload = json.loads(raw) if raw else {}\n\nprint('Payload recibido correctamente.')\nprint('type:', payload.get('type'))\nprint('recordId:', payload.get('recordId'))\nprint('playlistUrl:', payload.get('playlistUrl'))\n\nif payload.get('type') != 'integration_test':\n    raise SystemExit('Este workflow de prueba esperaba type=integration_test')\n\nif not payload.get('recordId'):\n    raise SystemExit('Falta recordId')\n\nif not payload.get('playlistUrl'):\n    raise SystemExit('Falta playlistUrl')\n\nprint('INTEGRATION TEST OK')\nPY"
        }
      ]
    }
  }
}
