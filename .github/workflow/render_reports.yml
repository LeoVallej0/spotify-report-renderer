{
  "name": "Render Spotify Reports",
  "on": {
    "repository_dispatch": {
      "types": [
        "render_real_test"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "real-render-test": {
      "name": "Real Spotify payload render test",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "steps": [
        {
          "name": "Checkout repository",
          "uses": "actions/checkout@v7"
        },
        {
          "name": "Setup Python 3.13",
          "uses": "actions/setup-python@v7",
          "with": {
            "python-version": "3.13"
          }
        },
        {
          "name": "Install Linux dependencies for WeasyPrint",
          "run": "sudo apt-get update\nsudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libharfbuzz-subset0 libfontconfig1 libffi-dev libjpeg-dev libopenjp2-7-dev shared-mime-info fonts-dejavu"
        },
        {
          "name": "Install Python packages",
          "run": "python -m pip install --upgrade pip\npython -m pip install weasyprint==70.0 pymupdf==1.28.2 pillow"
        },
        {
          "name": "Verify renderer libraries",
          "run": "python -c \"import weasyprint, pymupdf, PIL; print('WeasyPrint:', weasyprint.__version__); print('PyMuPDF:', pymupdf.__doc__.splitlines()[0]); print('Pillow:', PIL.__version__)\""
        },
        {
          "name": "Prepare payload",
          "env": {
            "PAYLOAD_JSON": "${{ toJson(github.event.client_payload) }}"
          },
          "run": "python - <<'PY'\nimport os\nfrom pathlib import Path\nraw = os.environ.get('PAYLOAD_JSON', '').strip()\nif not raw:\n    raise SystemExit('No client_payload received. Use Apps Script repository_dispatch for this test.')\nPath('payload.json').write_text(raw, encoding='utf-8')\nprint('Payload bytes:', len(raw.encode('utf-8')))\nPY"
        },
        {
          "name": "Check payload",
          "run": "python -c \"import json; p=json.load(open('payload.json', encoding='utf-8')); print('type=', p.get('type')); print('playlist=', p.get('playlistName')); print('recordId=', p.get('recordId')); print('X tracks=', len(p.get('playlistXTracks', []))); print('filler=', len(p.get('fillerTracks', []))); assert p.get('type')=='real_render_test'; assert p.get('recordId'); assert p.get('playlistUrl'); assert p.get('referenceTime'); assert p.get('playlistXTracks') is not None; assert p.get('fillerTracks') is not None\""
        },
        {
          "name": "Run real renderer",
          "run": "rm -rf artifacts/real_render_test\npython renderer/renderer_live.py payload.json --template renderer/templates/report_template.html --outdir artifacts/real_render_test"
        },
        {
          "name": "Validate real output",
          "run": "python -c \"import csv, json; from pathlib import Path; from PIL import Image; import pymupdf; out=Path('artifacts/real_render_test'); m=json.loads((out/'manifest.json').read_text(encoding='utf-8')); img=Image.open(out/'report_real.png'); doc=pymupdf.open(out/'report_real.pdf'); rows=list(csv.DictReader((out/'history_real.csv').open(encoding='utf-8'))); print('manifest=', json.dumps(m, ensure_ascii=False)); print('PNG=', img.size); print('PDF pages=', len(doc)); print('Rows=', len(rows)); print('Playlist X=', sum(r['origen']=='playlist_x' for r in rows)); print('Random=', sum(r['origen']=='random' for r in rows)); assert img.size==(2400,3400); assert len(doc)==1; assert len(rows)==50; assert sum(r['origen']=='playlist_x' for r in rows)==m['playlistXInputRows'] if m['playlistXInputRows']<=50 else 50; assert sum(r['origen']=='random' for r in rows)==50-min(m['playlistXInputRows'],50); print('REAL OUTPUT VALIDATION OK')\""
        },
        {
          "name": "Upload real test artifacts",
          "uses": "actions/upload-artifact@v7",
          "with": {
            "name": "real-render-test",
            "path": "artifacts/real_render_test",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        }
      ]
    }
  }
}
